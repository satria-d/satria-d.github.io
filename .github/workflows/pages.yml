name: Radar Karier
on:
  push:
    branches: [main]
    paths: ['web/**', 'radar/**', 'scripts/**', 'tests/**', 'sync_jobs.py', 'requirements.txt', 'package.json', 'package-lock.json', '.github/workflows/pages.yml']
  workflow_dispatch:
  schedule:
    - cron: '23 */6 * * *'
permissions:
  actions: read
  contents: write
  pages: write
  id-token: write
concurrency:
  group: radar-pages
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url || steps.deploy_retry.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: pip install -r requirements.txt
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: node --test tests/*.test.mjs
      - name: Collect and encrypt (when password is configured)
        env:
          RADAR_PASSWORD: ${{ secrets.RADAR_PASSWORD }}
          RADAR_SEED: ${{ secrets.RADAR_SEED }}
        run: |
          if [ -n "$RADAR_PASSWORD" ]; then
            node scripts/sync-encrypted.mjs
          else
            echo 'Password not configured. Publishing locked shell only.'
          fi
      - name: Save encrypted snapshot only
        run: |
          if [ -f web/data.enc.json ]; then
            git config user.name 'radar-karier-bot'
            git config user.email 'radar-karier-bot@users.noreply.github.com'
            git add web/data.enc.json
            if ! git diff --cached --quiet; then
              git commit -m 'data: encrypted career sync [skip ci]'
              git push
            fi
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        id: artifact
        with:
          path: web
      - name: Wait for uploaded Pages artifact
        uses: actions/github-script@v8
        env:
          PAGES_ARTIFACT_ID: ${{ steps.artifact.outputs.artifact_id }}
        with:
          script: |
            const {waitForArtifact} = await import(`${process.env.GITHUB_WORKSPACE}/scripts/pages-artifact.mjs`);
            await waitForArtifact(async () => {
              const {data} = await github.rest.actions.listWorkflowRunArtifacts({
                ...context.repo, run_id: context.runId, name: 'github-pages', per_page: 100,
              });
              return data.artifacts;
            }, {
              expectedId: process.env.PAGES_ARTIFACT_ID,
              onRetry: attempt => core.info(`Waiting for Pages artifact visibility (check ${attempt}/6).`),
            });
            core.info('Uploaded Pages artifact is available.');
      - name: Publish encrypted dashboard
        id: deploy
        continue-on-error: true
        uses: actions/deploy-pages@v4
        with:
          timeout: 300000
      - name: Wait before retrying Pages deployment
        if: ${{ steps.deploy.outcome == 'failure' }}
        uses: actions/github-script@v8
        with:
          script: |
            core.info('Pages deployment failed; retrying the same uploaded artifact in 20 seconds.');
            await new Promise(resolve => setTimeout(resolve, 20000));
      - name: Retry encrypted dashboard deployment
        if: ${{ steps.deploy.outcome == 'failure' }}
        id: deploy_retry
        uses: actions/deploy-pages@v4
        with:
          timeout: 300000
